service: athan-backend

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 30
  environment:
    DYNAMODB_TABLE: ${self:service}-${self:provider.stage}
    ENCRYPTION_KEY: ${env:ENCRYPTION_KEY, 'dev-encryption-key-change-in-prod'}
    LWA_CLIENT_ID: ${env:LWA_CLIENT_ID, ''}
    LWA_CLIENT_SECRET: ${env:LWA_CLIENT_SECRET, ''}
    STAGE: ${self:provider.stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - !GetAtt AthanDevicesTable.Arn

functions:
  syncConfig:
    handler: dist/functions/api/syncConfig.handler
    events:
      - http:
          path: api/config
          method: post
          cors: true

  getDevices:
    handler: dist/functions/api/getDevices.handler
    events:
      - http:
          path: api/devices
          method: get
          cors: true

  health:
    handler: dist/functions/api/health.handler
    events:
      - http:
          path: api/health
          method: get
          cors: true

  dailyCron:
    handler: dist/functions/scheduler/dailyCron.handler
    timeout: 300
    memorySize: 512
    events:
      - schedule:
          rate: cron(0 2 * * ? *)
          enabled: true
          description: "Daily prayer time scheduler - runs at 02:00 UTC"

resources:
  Resources:
    AthanDevicesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

plugins:
  - serverless-plugin-typescript
